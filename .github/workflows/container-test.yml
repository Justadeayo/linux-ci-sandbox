name: Container Smoke Test

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  docker-test:
    name: Build & Test Container
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Test Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: local-test-image:latest

      - name: Run Smoke Test Inside Container
        run: |
          echo "Verifying container execution..."
          docker run --rm local-test-image:latest /bin/sh -c "echo 'Container healthy and operational!'"
