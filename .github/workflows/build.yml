name: Linux Environment Pipeline - Single Run

on:
  workflow_dispatch:
    inputs:
      SKIP_UPLOAD:
        description: 'Skip SourceForge upload (0 = upload, 1 = test build)'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
      MANIFEST_LOCAL_BRANCH:
        description: 'Local manifest branch'
        required: true
        default: 'main'

env:
  ROM_NAME: "DerpFest"
  DEVICE: "violet"
  BUILD_TYPE: "user"
  REPO_MANIFEST_URL: "https://github.com/DerpFest-AOSP/android_manifest"
  REPO_MANIFEST_BRANCH: "17"
  MANIFEST_LOCAL_REPO: "https://github.com/Justadeayo/Manifest.git"
  ASSET_URL: "https://gist.githubusercontent.com/Justadeayo/d6543288b98712e5944bb6dec36d2091/raw/4c08760bc151daccc24db8f6a576c43d02a1fa36/keys.json"
  JSON_KEY: "violet"
  PRIV_DIR: "vendor/lineage-priv/keys"
  KEY_FP_EXPECTED: "6B:E0:C5:88:6C:C1:FD:B7:52:48:8A:4F:4A:B6:C3:C1:AA:A7:23:27:20:65:9A:2F:38:59:9B:2D:B4:5C:89:F6"
  SF_USER: "justus-26"
  SF_PROJECT: "derp-violet"
  SF_RECOVERY_DIR: "recovery-derp"
  TZ: "Africa/Lagos"

jobs:
  build:
    name: Build DerpFest violet (Single Run)
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Free Disk Space & Setup Workspace
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker system prune -af --volumes || true
          sudo apt-get clean
          sudo mkdir -p /mnt/rom
          sudo chown -R "$USER:$USER" /mnt/rom
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install Dependencies & Repo Tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git git-lfs gnupg gperf imagemagick jq lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop openssl pngcrush python3 \
            python3-pip rsync schedtool squashfs-tools unzip xsltproc yasm \
            zip zlib1g-dev gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu zstd
          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH
          git config --global user.name "Justus"
          git config --global user.email "Justadeayo@gmail.com"

      - name: Setup SourceForge SSH Key
        working-directory: /mnt/rom
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SF_SSH_KEY}" > ~/.ssh/sourceforge_ed25519
          chmod 600 ~/.ssh/sourceforge_ed25519

      - name: Run Full Build & Upload Logic
        working-directory: /mnt/rom
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          SKIP_UPLOAD: ${{ inputs.SKIP_UPLOAD }}
          MANIFEST_LOCAL_BRANCH: ${{ inputs.MANIFEST_LOCAL_BRANCH }}
        run: |
          tg_send() {
            local msg="$1"
            if [ -n "${TELEGRAM_BOT_TOKEN}" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
              curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "parse_mode=Markdown" \
                --data-urlencode "text=${msg}" >/dev/null 2>&1 || true
            fi
          }
          get_wat_time() { TZ="Africa/Lagos" date +'%Y-%m-%d %H:%M:%S WAT'; }

          tg_send "🚀 *Build Started (Single Run)!*
          📱 *Device:* \`${DEVICE}\`
          📦 *ROM:* \`${ROM_NAME}\` (Android 17)
          ⏰ *Started at:* $(get_wat_time)"

          START_TIME="$(date +%s)"

          # 1. Initialize & Shallow Sync Repo
          repo init -u "${REPO_MANIFEST_URL}" -b "${REPO_MANIFEST_BRANCH}" --git-lfs --depth=1
          git clone --depth=1 -b "${MANIFEST_LOCAL_BRANCH}" "${MANIFEST_LOCAL_REPO}" .repo/local_manifests
          repo sync -c --force-sync --force-remove-dirty --no-tags --no-clone-bundle --prune -j$(nproc)

          # 2. Release Keys Verification / Decryption
          key_fingerprint() { openssl x509 -in "$1" -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2; }
          own_keys_ok() { [ -f "${PRIV_DIR}/releasekey.pk8" ] && [ "$(key_fingerprint "${PRIV_DIR}/releasekey.x509.pem")" = "${KEY_FP_EXPECTED}" ]; }
          
          if own_keys_ok; then
            echo "✅ Release keys already on disk."
          elif [ -n "${KEY_PASS}" ]; then
            tmp="$(mktemp)"
            if curl -fsSL "${ASSET_URL}" | jq -er --arg k "${JSON_KEY}" '.[$k] // empty' | base64 -d > "${tmp}"; then
              mkdir -p "${PRIV_DIR}"
              KEY_PASS="${KEY_PASS}" openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KEY_PASS -in "${tmp}" | tar -xzC "${PRIV_DIR}" || true
            fi
            rm -f "${tmp}"
          fi
          
          if own_keys_ok; then
            printf 'PRODUCT_DEFAULT_DEV_CERTIFICATE := vendor/lineage-priv/keys/releasekey\n' > "${PRIV_DIR}/keys.mk"
            tg_send "🔑 *Signing:* personal release key verified"
          else
            tg_send "⚠️ *Release key unavailable.* Building test-signed."
          fi

          # 3. Clang Guard & Repair Logic
          CLANG_PRJ="prebuilts/clang/host/linux-x86"
          CLANG_TAG="refs/tags/android-17.0.0_r1"
          
          clang_ok() {
            local dir="$1"
            "${dir}/bin/clang" --version >/dev/null 2>&1 || return 1
            local so
            so="$(find -L "${dir}/lib" -maxdepth 1 -name 'libclang.so*' -size +1M 2>/dev/null | head -1)"
            [ -n "${so}" ] || return 1
            python3 -c "import ctypes,sys; ctypes.CDLL(sys.argv[1])" "${so}" >/dev/null 2>&1 || return 1
            ls "${dir}"/lib/clang/*/include/stdbool.h >/dev/null 2>&1 || return 1
            return 0
          }

          ensure_clang() {
            local prj="$1" name="$2" tag="$3" dir="${1}/${2}"
            clang_ok "${dir}" && return 0
            git -C "${prj}" checkout HEAD -- "${name}" 2>/dev/null || true
            clang_ok "${dir}" && return 0
            rm -rf "${dir}" && mkdir -p "${dir}"
            curl -fsSL --retry 3 "https://android.googlesource.com/platform/${prj}/+archive/${tag}/${name}.tar.gz" | tar -xzC "${dir}" || true
          }

          ensure_clang "${CLANG_PRJ}" "clang-r584948" "${CLANG_TAG}"
          ensure_clang "${CLANG_PRJ}" "clang-r596125" "${CLANG_TAG}"

          # 4. Compilation
          . build/envsetup.sh
          lunch "lineage_${DEVICE}-cp2a-${BUILD_TYPE}"

          export R8_MAX_HEAP_SIZE=8192M
          make installclean

          if m derp; then
            BUILD_OK=1
          else
            BUILD_OK=0
          fi

          END_TIME="$(date +%s)"
          DUR=$(( END_TIME - START_TIME ))
          HOURS=$(( DUR / 3600 ))
          MINS=$(( (DUR % 3600) / 60 ))
          BUILD_TIME="${HOURS}h ${MINS}m"

          # 5. SourceForge Upload & Final Notification
          OUT_DIR="out/target/product/${DEVICE}"
          ROM_ZIP=$(ls -t "${OUT_DIR}"/DerpFest-*.zip 2>/dev/null | head -1 || true)
          ROM_LINK=""
          ROM_SHA=""
          ROM_SIZE="not built"
          RECOVERY_LINK=""

          sf_upload() {
            local FILE="$1" SUB="${2:-}" FNAME DEST_DIR SSH DEST URL CODE i
            FNAME=$(basename "${FILE}")
            DEST_DIR="${SUB:+$SUB/}"
            SSH="ssh -i ~/.ssh/sourceforge_ed25519 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30"
            DEST="${SF_USER},${SF_PROJECT}@frs.sourceforge.net:/home/frs/project/${SF_PROJECT}/${DEST_DIR}"
            for i in 1 2 3 4 5; do
              rsync -a --partial --timeout=120 --chmod=D755,F644 -e "${SSH}" "${FILE}" "${DEST}" >&2 && break
              sleep 30
            done
            echo "https://sourceforge.net/projects/${SF_PROJECT}/files/${DEST_DIR}${FNAME}/download"
          }

          if [ "${SKIP_UPLOAD:-0}" = "1" ]; then
            UPLOAD_RESULTS="⏭️ Upload skipped (test build)"
          elif [ "${BUILD_OK}" -ne 1 ]; then
            UPLOAD_RESULTS="❌ Build failed."
          elif [ -n "${ROM_ZIP}" ] && [ -f "${ROM_ZIP}" ]; then
            ROM_SIZE=$(du -h "${ROM_ZIP}" | cut -f1)
            ROM_SHA=$(sha256sum "${ROM_ZIP}" | cut -d' ' -f1)
            ROM_LINK=$(sf_upload "${ROM_ZIP}" "" || true)

            if [ -f "${OUT_DIR}/recovery.img" ]; then
              REC_FILE="${OUT_DIR}/derp-recovery-$(date +%Y%m%d).img"
              cp "${OUT_DIR}/recovery.img" "${REC_FILE}"
              RECOVERY_LINK=$(sf_upload "${REC_FILE}" "${SF_RECOVERY_DIR}" || true)
              rm -f "${REC_FILE}"
            fi
            UPLOAD_RESULTS="📤 *SourceForge (ROM):* ${ROM_LINK:-upload failed}
            🔐 *SHA256:* \`${ROM_SHA}\`"
          else
            UPLOAD_RESULTS="❌ ROM zip not found."
          fi

          tg_send "🎉 *Build Finished!*
          📱 *Device:* \`${DEVICE}\`
          📦 *ROM:* \`${ROM_NAME}\` (Android 17)
          ⏱ *Compile Time:* \`${BUILD_TIME}\`
          📏 *Size:* \`${ROM_SIZE}\`
          ⏰ *Finished at:* $(get_wat_time)

          ${UPLOAD_RESULTS}"
